<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArkGlide Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d1018;color:#e8edf7;font:16px system-ui,sans-serif}body{display:flex;flex-direction:column}button{font:inherit;background:#4259bc;color:white;border:0;border-radius:8px;padding:9px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #a7bcff;outline-offset:3px}header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#181e2d;flex-wrap:wrap}h1{font-size:16px;margin:0;flex:1}#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}iframe{border:0;display:block;width:100%;height:100%;background:#0d0d0d}#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0d1018;z-index:2;padding:24px}#cover[hidden]{display:none}#card{max-width:600px;width:100%}#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}progress{width:100%;height:10px;accent-color:#819bff}#detail{font-size:13px;color:#adb9d2}#diagnostic{margin:0;padding:6px 16px;background:#3a2029;max-height:100px;overflow:auto;white-space:pre-wrap;font-size:13px}#diagnostic:empty{display:none}@media(max-width:600px){header{padding:8px;gap:6px}button{font-size:14px;padding:8px 10px}}
</style>
</head>
<body data-state="idle">
<header><h1 id="title">ArkGlide Game</h1><button id="start">开始游戏</button><button id="pause" disabled>暂停</button><button id="stop" disabled>停止</button><button id="fullscreen">全屏</button></header>
<pre id="diagnostic" role="alert"></pre>
<main id="stage"><section id="cover"><div id="card"><h2>准备开始</h2><p id="status" role="status" aria-live="polite">点击“开始游戏”加载项目</p><progress id="progress" value="0" max="1"></progress><p id="detail">使用 HTTP/HTTPS 静态服务器打开；游戏内可点击启用音频。</p></div></section></main>
<script src="./arkglide-state.js"></script>
<script src="./arkglide-storage-host.js"></script>
<script src="./standalone-player.js"></script>
</body></html>
