<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>ArkGlide Game</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090c10;
        color: #b7c7b9;
        font:
          13px/1.65 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #boot {
        position: absolute;
        inset: 0;
        padding: clamp(20px, 4vw, 64px);
        overflow: auto;
        background: #090c10;
        z-index: 2;
      }
      #boot[hidden] {
        display: none;
      }
      #status {
        color: #e0e8e1;
        margin-bottom: 16px;
        white-space: pre-wrap;
      }
      #loadingLog {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
      }
      #retry {
        margin-top: 20px;
        color: inherit;
        border: 1px solid #52665a;
        background: transparent;
        padding: 8px 20px;
        font: inherit;
        cursor: pointer;
      }
      #gameLog {
        position: absolute;
        left: 8px;
        bottom: 8px;
        max-width: min(90vw, 900px);
        z-index: 3;
        background: #090c10cc;
        color: #cbd7ce;
      }
      #gameLog[hidden] {
        display: none;
      }
      #gameLog summary {
        padding: 4px 8px;
        cursor: pointer;
      }
      #logs {
        margin: 0;
        padding: 8px;
        max-height: 30vh;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #stage:focus-visible {
        outline: none;
      }
    </style>
  </head>
  <body data-state="loading">
    <main id="stage"></main>
    <section id="boot">
      <div id="status" role="status" aria-live="polite">
        ArkGlide / 正在加载
      </div>
      <pre id="loadingLog"></pre>
      <button id="retry" hidden>重新加载</button>
    </section>
    <details id="gameLog" hidden>
      <summary>游戏日志</summary>
      <pre id="logs"></pre>
    </details>
    <script src="./arkglide-state.js"></script>
    <script src="./arkglide-storage-host.js"></script>
    <script src="./standalone-player.js"></script>
  </body>
</html>
